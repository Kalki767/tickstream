# Postgres + tickstream. Credentials come from the environment (or a .env file
# next to this one), never from this file:
#   echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
#   docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tickstream
      POSTGRES_USER: tickstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment or .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickstream -d tickstream"]
      interval: 2s
      timeout: 3s
      retries: 30

  tickstream:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TICKSTREAM_DSN: host=postgres dbname=tickstream user=tickstream password=${POSTGRES_PASSWORD}
    command: ["--batch-size", "${TICKSTREAM_BATCH_SIZE:-1000}", "--flush-ms", "${TICKSTREAM_FLUSH_MS:-200}"]
    stop_signal: SIGINT        # graceful shutdown: close frame, drain, commit
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
